<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>APN</title>
<style>
/* Catppuccin Latte (light) and Frappé (dark) surfaces, as the examples page
   (examples/elm/index.apn) has them; src/editor.ts sets data-theme and adds
   the token colors from src/highlight.ts. */
:root { --mono: "SF Mono", SFMono-Regular, ui-monospace, Menlo, Consolas, monospace; }
:root, :root[data-theme="light"] {
    --base: #eff1f5; --mantle: #e6e9ef; --crust: #dce0e8; --surface0: #ccd0da; --surface1: #bcc0cc;
    --text: #4c4f69; --subtext: #6c6f85; --overlay: #9ca0b0; --accent: #1e66f5; --on-accent: #eff1f5; --selection: rgba(30, 102, 245, .18);
}
@media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
        --base: #303446; --mantle: #292c3c; --crust: #232634; --surface0: #414559; --surface1: #51576d;
        --text: #c6d0f5; --subtext: #a5adce; --overlay: #737994; --accent: #8caaee; --on-accent: #232634; --selection: rgba(140, 170, 238, .25);
    }
}
:root[data-theme="dark"] {
    --base: #303446; --mantle: #292c3c; --crust: #232634; --surface0: #414559; --surface1: #51576d;
    --text: #c6d0f5; --subtext: #a5adce; --overlay: #737994; --accent: #8caaee; --on-accent: #232634; --selection: rgba(140, 170, 238, .25);
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { display: flex; flex-direction: column; background: var(--base); color: var(--text); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 12px 16px 0; }
header a { color: var(--accent); text-decoration: none; }
header a:hover { text-decoration: underline; }
.brand { font-size: 17px; font-weight: 700; letter-spacing: -.01em; color: var(--text); margin-right: 8px; }
.brand:hover { text-decoration: none; color: var(--accent); }
select, button { font: inherit; height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--crust); background: var(--mantle); color: var(--text); cursor: pointer; }
select { padding-right: 8px; min-width: 150px; }
button:hover, select:hover { border-color: var(--surface0); background: var(--surface0); }
button:focus-visible, select:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
button.primary:hover { filter: brightness(1.08); background: var(--accent); }
.hint { color: var(--subtext); font-size: 12px; margin-left: 4px; }
kbd { font: 11px var(--mono); padding: 1px 5px; border: 1px solid var(--surface0); border-bottom-width: 2px; border-radius: 4px; }
.spacer { flex: 1; }
/* The code and its result are cards, as the examples page's sections are. */
main { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; min-height: 0; padding: 12px 16px 16px; }
.code, .result { background: var(--mantle); border: 1px solid var(--crust); border-radius: 12px; }
.code { overflow: auto; scrollbar-width: thin; scrollbar-color: var(--surface1) transparent; }
.lines { position: relative; min-height: 100%; display: grid; grid-template-columns: auto 1fr; }
.gutter, pre.highlight, textarea { font: 13px/1.6 var(--mono); tab-size: 4; }
.gutter { position: sticky; left: 0; z-index: 1; padding: 14px 12px 14px 16px; text-align: right; color: var(--overlay); background: var(--mantle); border-right: 1px solid var(--crust); user-select: none; white-space: pre; }
.layers { position: relative; }
pre.highlight, textarea { margin: 0; padding: 14px 16px; border: 0; white-space: pre; overflow: hidden; }
pre.highlight { pointer-events: none; min-height: 100%; color: var(--text); }
/* A guide after column 99: longer lines are syntax errors. */
pre.highlight { background: linear-gradient(to right, transparent calc(16px + 99ch), var(--surface0) 0,
    var(--surface0) calc(16px + 99ch + 1px), transparent 0) no-repeat; }
textarea { position: absolute; inset: 0; width: 100%; height: 100%; resize: none; outline: none; background: transparent; color: transparent; caret-color: var(--text); }
textarea::selection { background: var(--selection); color: transparent; }
.result { display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.result .label { padding: 12px 20px 8px; font-size: 12px; font-weight: 600; color: var(--subtext); letter-spacing: .06em; text-transform: uppercase; }
/* The program's own page, as it would be on its own. */
iframe { flex: 1; margin: 0 8px 8px; border: 1px solid var(--crust); border-radius: 8px; background: #fff; }
@media (max-width: 760px) {
    main { grid-template-columns: 1fr; grid-template-rows: minmax(240px, 1fr) minmax(320px, 1fr); }
    .hint { display: none; }
}
</style>
<body>
<header>
    <a class="brand" href="index.html">Examples</a>
    <select id="examples" aria-label="Example"></select>
    <button id="run" class="primary" title="Run (Ctrl+Enter)">Run</button>
    <button id="reset" title="Discard your changes to this example">Reset</button>
    <span class="hint"><kbd>Ctrl</kbd>+<kbd>Enter</kbd> runs · <kbd>Tab</kbd> indents</span>
    <span class="spacer"></span>
    <a id="original" target="_blank" rel="noopener" hidden>Original ↗</a>
    <button id="theme"></button>
</header>
<main>
    <div class="code"><div class="lines"><div class="gutter" id="gutter" aria-hidden="true"></div><div class="layers"><pre class="highlight" id="highlight" aria-hidden="true"></pre><textarea id="source" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="APN source"></textarea></div></div></div>
    <div class="result"><div class="label">Result</div><iframe id="preview" title="Result" sandbox="allow-scripts allow-modals allow-downloads"></iframe></div>
</main>
<script id="apn-site" type="application/json">/*SITE*/</script>
<script id="apn-runtime" type="text/plain">/*RUNTIME*/</script>
<script type="module">/*EDITOR*/</script>
</body>
</html>
